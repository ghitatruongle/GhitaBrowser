<?xml version="1.0" encoding="UTF-8"?>
<!-- GhitaBrowser "Ghita Lửa" logo - v0.6.0
     Rounded badge, fire gradient (FF8C42 -> F25022 -> A63A2B),
     bold white "G" with an amber flame rising inside the counter. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8C42"/>
      <stop offset="0.55" stop-color="#F25022"/>
      <stop offset="1" stop-color="#A63A2B"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="0.6" stop-color="#F7B32B"/>
      <stop offset="1" stop-color="#D64545"/>
    </linearGradient>
    <clipPath id="badgeclip">
      <rect x="64" y="64" width="896" height="896" rx="224"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#fire)"/>

  <!-- Glossy top sheen -->
  <rect x="120" y="88" width="784" height="320" rx="160" fill="#FFFFFF" opacity="0.14" clip-path="url(#badgeclip)"/>

  <!-- Amber flame rising inside the G counter (drawn before the G so it stays inside) -->
  <g fill="url(#flameInner)">
    <path d="M512 300 C585 372 628 452 582 540 C552 592 537 618 512 632 C486 618 470 592 442 540 C398 456 440 370 512 300 Z"/>
    <path d="M512 428 C549 466 568 510 544 553 C529 586 521 600 512 610 C503 600 495 586 481 553 C457 512 476 466 512 428 Z" fill="#FFF3C4" opacity="0.9"/>
  </g>

  <!-- White bold G -->
  <text x="512" y="742" font-family="Arial Black, Arial, sans-serif" font-size="620" font-weight="900" fill="#FFFFFF" text-anchor="middle">G</text>

  <!-- Ember sparks -->
  <circle cx="812" cy="330" r="16" fill="#FFD66B"/>
  <circle cx="858" cy="452" r="11" fill="#F7B32B"/>
  <circle cx="806" cy="566" r="9" fill="#D64545"/>

  <!-- Inner rim -->
  <rect x="72" y="72" width="880" height="880" rx="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10"/>
</svg>
