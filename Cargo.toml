[package]
name = "ghitabrowser"
version = "0.0.2"
edition = "2021"
authors = ["You"]
description = "A lightweight Rust browser optimized faster than Chrome"
license = "MIT"

[dependencies]
# Window management
winit = { version = "0.29", features = ["serde"] }

# Iced GUI framework - using tokio feature instead of async
iced = { version = "0.12", features = ["tokio", "image"] }

# Image handling
image = "0.24"

# Raw window handle interop
raw-window-handle = "0.5"

# Logging
log = "0.4"
env_logger = "0.11"

# HTTP client - real networking
ureq = { version = "2.9", features = ["json"] }

# URL parsing
url = "2.5"

# Serialization for storage persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time for cookies
chrono = "0.4"

# Utilities
anyhow = "1.0"
dirs = "5.0"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
criterion = "0.5"
rstest = "0.18"
