[package]
name = "ghitabrowser"
version = "1.1.0"
edition = "2021"
authors = ["You"]
description = "A Chrome-style lightweight browser written 100% in safe Rust"
license = "MIT"

[dependencies]
# Iced GUI framework - canvas feature powers the real pixel renderer
iced = { version = "0.12", features = ["tokio", "image", "canvas"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Image handling
image = "0.24"

# Logging
log = "0.4"
env_logger = "0.11"

# HTTP client - real networking
ureq = { version = "2.9", features = ["json"] }

# URL parsing
url = "2.5"

# Serialization for storage persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time for cookies
chrono = "0.4"

# Utilities
anyhow = "1.0"
dirs = "5.0"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
criterion = "0.5"
rstest = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
